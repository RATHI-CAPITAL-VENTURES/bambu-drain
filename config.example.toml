# bambu-drain — the Pi pretends to be a USB stick; the stick never fills up.
#
# Copy to /etc/bambu-drain/config.toml on the Pi and edit.

[gadget]
name       = "bambu"
udc        = ""                          # "" = autodetect the first UDC
image      = "/srv/bambu-drain/stick.img"
size_gb    = 32                          # what the printer will see
fs         = "exfat"                     # "exfat" or "fat32" — see README
vendor     = "BambuDrn"                  # <= 8 chars (SCSI inquiry)
product    = "Drain"                     # <= 16 chars
serial     = "BD00000001"

[drain]
# The gadget is only ejected when the printer has been quiet this long. The
# signal is the backing image's mtime — purely local, no network, no MQTT.
idle_minutes         = 5
# Never move a file younger than this, even during an idle window.
min_file_age_minutes = 2
poll_seconds         = 30
mount_point          = "/mnt/bambu-stick"
staging              = "/srv/bambu-drain/staging"
# Refuse to drain if staging is over budget — protects the Pi's root fs when
# the ship loop is broken or the Mac is off.
staging_max_gb       = 64
# If a drain pass somehow runs long, re-insert the media anyway. The printer
# seeing media come back matters more than finishing the pass.
max_eject_seconds    = 120
# Once the printer has been quiet this long it is not between layers, it is
# finished — so a longer window is safe, and a big backlog drains in one pass
# instead of a dozen. A 4-hour print left 5.4 GB behind; at 120 s that took four
# passes over ~25 minutes.
long_idle_minutes         = 20
max_eject_seconds_long_idle = 900

# --- what to drain -----------------------------------------------------------
# A registry, not branches. One row per kind of file the printer leaves behind.
# ORDER MATTERS: the first matching rule wins, so put specific globs first.
#
# `group = "print"` files land in prints/<session>/<dest>/, grouping everything
# from one run together. Files without it keep the dated <dest>/YYYY/MM/ layout,
# because a sliced model does not belong to any single print.

# The assembled timelapse — one per print, and the thing you actually want to
# watch. Renamed, because the folder is already named for its date. MUST come
# before the generic *.mp4 rule below.
[[rule]]
glob   = "timelapse/video_*.mp4"
group  = "print"
dest   = ""                              # the print folder root
rename = "timelapse.mp4"
# Written once, when a print ends — so it closes the session. Without this a
# failed print and its redo end up in one folder; they were only 26 minutes
# apart, and gaps within a print reach 18.
ends_session = true
delete = true

# The chamber camera recording. SEGMENTED: ~240 MB every 11-14 minutes, so a
# 4-hour print produces 22 of these and 5.4 GB.
[[rule]]
glob   = "**/*.mp4"
group  = "print"
dest   = "video"
# The chamber recording rotates at a FIXED SIZE, so every full segment is within
# 0.1% of every other. A short one was closed early, which means the print
# stopped — the strongest boundary signal available, and the only one that works
# when the timelapse went to internal storage. The full size is learned from
# history, not configured.
#
# Measured over 61 segments: full ones were all 240.2-240.4 MB, every genuine
# ending came in at 12-91%, and nothing landed between 92% and 99%.
ends_session_if_short = 0.95
delete = true

[[rule]]
glob   = "**/*.avi"
group  = "print"
dest   = "video"
delete = true

# The sliced file the printer receives when you press print. It lands ~15
# minutes BEFORE the first chamber segment, which makes it the only START marker
# available — every other signal can only tell us a print has ENDED. Its
# filename is the project name, so it names the folder too.
#
# Bambu Studio falls back to the PROCESS PRESET name when the project is
# unnamed, so roughly half arrive as "0.2mm layer, 2 walls, 15% infill". Those
# are detected and the folder keeps a plain timestamp instead.
[[rule]]
glob   = "**/*.3mf"
group  = "print"
dest   = ""                              # the print folder root
starts_session = true
names_session  = true
delete = true

[[rule]]
glob   = "**/*.gcode"
group  = "print"
dest   = ""
delete = true

# The P2S writes JPEG thumbnails alongside every recording, in
# /ipcam/thumbnail/ and /timelapse/thumbnail/. Observed on real hardware — the
# first version of this file only listed *.png and would have accumulated them
# forever, which defeats the entire point.
[[rule]]
glob   = "**/*.jpg"
group  = "print"
dest   = "thumbnails"
delete = true

[[rule]]
glob   = "**/*.jpeg"
group  = "print"
dest   = "thumbnails"
delete = true

[[rule]]
glob   = "**/*.png"
group  = "print"
dest   = "thumbnails"
delete = true

# Firmware images you drop on the stick on purpose. Archived, never deleted —
# the printer needs them to stay put to actually apply the update.
[[rule]]
glob   = "**/*.bbl.bin"
dest   = "firmware"
delete = false

[ship]
host          = "ishan-mac"              # an ssh alias in the Pi's ~/.ssh/config
# The archive root. The LAST component is just a folder name — pick whatever you
# want to see in Finder; nothing depends on it. Point it inside iCloud Drive to
# get the archive on your phone, or anywhere else for a purely local copy.
dest          = "~/Library/Mobile Documents/com~apple~CloudDocs/My3dPrints"
# Must match the Pi's real user — Raspberry Pi OS no longer defaults to "pi".
ssh_key       = "/home/rpi/.ssh/id_ed25519"
poll_seconds  = 300
# 0 = keep forever. Set to e.g. 60 if iCloud starts hurting.
retention_days = 0

[health]
status_file = "/srv/bambu-drain/status.json"
