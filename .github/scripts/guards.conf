# Guard configuration for this project.
#
# GENERATED BY bootstrap FROM REPO LAYOUT — it is a guess, not a
# reading of your intent. Check every pattern against a real PR before
# trusting it; a pattern that matches nothing makes a guard that
# always passes, which is worse than not having it.
#
# See guards.conf.example in the template for what each knob does.

APP="."
APP_PREFIX="$(app_prefix "$APP")"

VERSION_FILE="${APP_PREFIX}VERSION"
VERSION_FIELDS=3
VERSION_MIRRORS=""
CHANGELOG="${APP_PREFIX}CHANGELOG.md"
CHANGELOG_ARCHIVE_DIR="${APP_PREFIX}docs/changelog"
CHANGELOG_ARCHIVE_CMD="make changelog-archive"
RETRO_DIR="${APP_PREFIX}docs/retros"

DOCS_CODE_PATTERN="^${APP_PREFIX}bambu_drain/.*\.py$"
TESTS_CODE_PATTERN="^${APP_PREFIX}bambu_drain/.*\.py$"
TESTS_TARGET_PATTERN="^${APP_PREFIX}tests/.*\.py$"
DOCS_TARGET_PATTERN="^(${APP_PREFIX}docs/.*\.md|${APP_PREFIX}README\.md|${APP_PREFIX}CLAUDE\.md)$"
DOCS_HINT="  - new module or rule kind -> ${APP_PREFIX}docs/ARCHITECTURE.md"

# EMPTY = the PATCH-bump challenge is off. Fill this in with whatever
# a new user-visible surface looks like here (a route, a page, a tool).
CAPABILITY_ADD_PATTERN="^(${APP_PREFIX}bambu_drain/[a-z_]+\.py|${APP_PREFIX}deploy/.*\.service)$"

RETRO_DEBT_MAX=8
ALLOW_COMMIT_TAGS=1
SCOPE_RULES="app:^${APP_PREFIX}
ci_config:^\.github/"
